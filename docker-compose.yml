version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reposage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reposage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reposage_password}
      POSTGRES_DB: ${POSTGRES_DB:-reposage}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reposage} -d ${POSTGRES_DB:-reposage}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reposage-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reposage-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-reposage}:${POSTGRES_PASSWORD:-reposage_password}@postgres:5432/${POSTGRES_DB:-reposage}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-reposage}:${POSTGRES_PASSWORD:-reposage_password}@postgres:5432/${POSTGRES_DB:-reposage}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-mock}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - MOCK_GITHUB_ENABLED=${MOCK_GITHUB_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reposage-worker
    command: celery -A app.tasks.celery_app worker -l info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-reposage}:${POSTGRES_PASSWORD:-reposage_password}@postgres:5432/${POSTGRES_DB:-reposage}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-reposage}:${POSTGRES_PASSWORD:-reposage_password}@postgres:5432/${POSTGRES_DB:-reposage}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-mock}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - MOCK_GITHUB_ENABLED=${MOCK_GITHUB_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reposage-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
