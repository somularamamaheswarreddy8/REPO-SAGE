[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reposage-backend"
version = "0.1.0"
description = "RepoSage: Secure AI Code Review & Repository Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
